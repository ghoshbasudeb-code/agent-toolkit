[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-toolkit"
version = "0.1.0"
description = "Internal SDK and reusable building blocks for AI agents"
dependencies = [
    "langchain-core>=0.1.0",
    "langchain-openai>=0.0.5",
    "langchain-community>=0.0.20",
    "pydantic>=2.0.0",
    "tavily-python>=0.3.0",
    "sqlalchemy>=2.0.0",
    "requests>=2.31.0",
    "pinecone>=3.0.0",
    "sentence-transformers>=2.2.0",
    "torch>=2.0.0",
    "datasets>=2.14.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_sdk*"]
